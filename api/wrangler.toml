name = "sfl-api"
main = "src/index.js"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "sfl-db"
database_id = "d1968d0f-a984-4fd2-bf4e-c2e0d70f242b"

[[r2_buckets]]
binding = "R2"
bucket_name = "sfl-data"

[ai]
binding = "AI"

[vars]
# API_KEY is set via: wrangler secret put API_KEY
# Chat forwarding (optional):
#   CHAT_WEBHOOK_URL — chat messages are forwarded here instead of getting an AI reply
#   WEBHOOK_SECRET   — sent as X-SFL-Secret with chat forwards (wrangler secret put WEBHOOK_SECRET)

[triggers]
# No scheduled work. The empty list removes the cron trigger the Worker once had.
crons = []
